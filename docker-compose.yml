services:
  mysql:
    image: mysql:8.0
    container_name: devops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devopsroot
      MYSQL_DATABASE: devops_app
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - devops-network

  backend:
    build:
      context: ./backend
    container_name: devops-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: devopsroot
      DB_NAME: devops_app
      DB_PORT: 3306
    ports:
      - "5001:5000"
    depends_on:
      - mysql
    networks:
      - devops-network

  frontend:
    build:
      context: ./frontend
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - devops-network

volumes:
  mysql_data:

networks:
  devops-network:
    driver: bridge
